[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-lab"
version = "0.1.0"
description = "Implémentations pédagogiques de modèles de diffusion (DDPM, DDIM, guidance…)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
vision = ["torchvision"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
